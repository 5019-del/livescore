
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<script>
    // Thiết lập mật khẩu của bạn ở đây
    const SECRET_KEY = "tony888"; 

    // Kiểm tra mã trên đường link (Ví dụ: .../index.html?key=tony888)
    const urlParams = new URLSearchParams(window.location.search);
    const userKey = urlParams.get('key');

    if (userKey !== SECRET_KEY) {
        document.body.innerHTML = "<h1>403 Forbidden: Sai mã truy cập!</h1>";
        window.stop(); // Dừng tải trang
    }
</script>

    <style>
        body { 
            background: transparent; 
            color: #ffffff; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        /* GIAO DIỆN SCOREBOARD */
        .scoreboard {
            display: inline-flex;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #444;
        }
        .team-name {
            font-size: 26px;
            font-weight: 800;
            padding: 12px 20px;
            background: #252525;
            min-width: 90px;
            text-transform: uppercase;
        }
        .team-score {
            font-size: 40px;
            font-weight: bold;
            padding: 10px 25px;
            min-width: 45px;
            background: #000;
        }
        .home-side { border-left: 5px solid #3498db; }
        .away-side { border-right: 5px solid #e74c3c; }
        
        .timer-box {
            padding: 5px 25px;
            background: #111;
            min-width: 110px;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }
        .timer { font-size: 34px; font-weight: bold; font-variant-numeric: tabular-nums; color: #f1c40f; }
        .period-display { font-size: 14px; color: #00ff00; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: -5px; }

        /* BẢNG ĐIỀU KHIỂN (INTERACT) */
        .controls { 
            margin-top: 30px; 
            background: #2c2c2c; 
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            color: white;
            border: 1px solid #555;
            text-align: left;
        }
        .control-group { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #444; }
        label { font-size: 11px; color: #bbb; display: block; margin-bottom: 5px; text-transform: uppercase; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #666; background: #111; color: white; margin-bottom: 10px; }
        .input-name { width: 100px; font-weight: bold; }
        .input-time { width: 50px; text-align: center; }
        
        button { padding: 8px 12px; cursor: pointer; margin: 2px; font-weight: bold; border-radius: 4px; border: none; text-transform: uppercase; font-size: 12px; }
        .btn-blue { background: #007bff; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-red { background: #dc3545; color: white; }
        .btn-gray { background: #555; color: white; }
        .btn-orange { background: #fd7e14; color: white; }
        .btn-period { background: #444; color: #ddd; border: 1px solid #666; }
        .btn-period:hover { background: #666; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="team-name home-side" id="display-home-name">AME</div>
        <div class="team-score" id="home-score">0</div>
        <div class="timer-box">
            <span class="period-display" id="display-period">1ST</span>
            <div class="timer" id="display-time">00:00</div>
        </div>
        <div class="team-score" id="away-score">0</div>
        <div class="team-name away-side" id="display-away-name">REC</div>
    </div>

    <br>

    <div class="controls">
        <div class="control-group">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div>
                    <label>Home Team</label>
                    <input type="text" id="homeNameInput" class="input-name" value="AME" oninput="updateNames()">
                </div>
                <div>
                    <label>Away Team</label>
                    <input type="text" id="awayNameInput" class="input-name" value="REC" oninput="updateNames()">
                </div>
            </div>
            
            <label>Select Period (Click to change)</label>
            <button class="btn-period" onclick="setPeriod('1ST')">1st Half</button>
            <button class="btn-period" onclick="setPeriod('HT')">HT</button>
            <button class="btn-period" onclick="setPeriod('2ND')">2nd Half</button>
            <button class="btn-period" onclick="setPeriod('OT')">OT</button>
            <button class="btn-period" onclick="setPeriod('FT')">FT</button>
        </div>

        <div class="control-group">
            <label>Score Control</label>
            <button class="btn-blue" onclick="changeScore('home', 1)">HOME +1</button>
            <button class="btn-gray" onclick="changeScore('home', -1)">-1</button>
            <span style="margin: 0 10px;">|</span>
            <button class="btn-red" onclick="changeScore('away', 1)">AWAY +1</button>
            <button class="btn-gray" onclick="changeScore('away', -1)">-1</button>
        </div>

        <div class="control-group">
            <label>Timer Control</label>
            <input type="number" id="minInput" class="input-time" placeholder="Min"> : 
            <input type="number" id="secInput" class="input-time" placeholder="Sec">
            <button class="btn-orange" onclick="manualSet()">SET TIME</button>
            <br>
            <button class="btn-green" onclick="startTimer()">START</button>
            <button class="btn-red" onclick="stopTimer()">PAUSE</button>
            <button class="btn-gray" onclick="resetAll()">RESET ALL</button>
        </div>
    </div>

    <script>
        let seconds = 0;
        let timerInterval;
        let scores = { home: 0, away: 0 };

        function updateNames() {
            document.getElementById('display-home-name').innerText = document.getElementById('homeNameInput').value || "HOME";
            document.getElementById('display-away-name').innerText = document.getElementById('awayNameInput').value || "AWAY";
        }

        function setPeriod(p) {
            document.getElementById('display-period').innerText = p;
        }

        function updateDisplay() {
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            document.getElementById('display-time').innerHTML = 
                (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
        }

        function changeScore(team, val) {
            scores[team] += val;
            if (scores[team] < 0) scores[team] = 0;
            document.getElementById(team + '-score').innerText = scores[team];
        }

        function manualSet() {
            let m = parseInt(document.getElementById('minInput').value) || 0;
            let s = parseInt(document.getElementById('secInput').value) || 0;
            seconds = (m * 60) + s;
            updateDisplay();
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                seconds++;
                updateDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetAll() {
            if(!confirm("Reset everything?")) return;
            stopTimer();
            seconds = 0;
            scores = { home: 0, away: 0 };
            document.getElementById('home-score').innerText = "0";
            document.getElementById('away-score').innerText = "0";
            setPeriod('1ST');
            updateDisplay();
        }

        updateNames();
    </script>
</body>
</html>
